name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Checks the live data source still downloads and parses; doesn't commit anything.
  live-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/diag.ts
      - run: npm run sync-data
        env:
          ATP_DATA_BASE_URL: ${{ vars.ATP_DATA_BASE_URL }}
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: atp-data
          path: data/atp.json
